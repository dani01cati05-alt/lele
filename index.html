<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lele.matic</title>
  <!-- CSS ESTERNO -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="cursore.css">
  <link rel="stylesheet" href="newsticker.css">
  
  <!-- LIBRERIA MODEL VIEWER -->
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>
</head>
<body>

  <div class="news-ticker">
  <div class="ticker-content">
    Army of the War Pigs OUT NOW / Army of the War Pigs OUT NOW / Army of the War Pigs OUT NOW /
  </div>
</div>
  
  <div class="container">
    <!-- MENU 1 -->
    <a class="menu" href="https://www.instagram.com/lele.matic?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==">
      <model-viewer
        src="securitycam-v2.glb"
        auto-rotate
        rotation-per-second="30deg"
        disable-zoom
        shadow-intensity="1">
      </model-viewer>
      <!-- ICONA PNG -->
      <img src="lelematicIG.png" class="menu-icon" alt="Icona 1">
    </a>
    <!-- MENU 2 — porta al sottomenù -->
    <a class="menu" href="zine.html">
      <model-viewer
        src="zine-v1.glb"
        auto-rotate
        rotation-per-second="40deg"
        disable-zoom
        shadow-intensity="1">
      </model-viewer>
      <!-- ICONA PNG -->
      <img src="zine_title.png" class="menu-icon" alt="Icona 2">
    </a>
  </div>
</body>
</html>
