<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lele-matic</title>
  
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <style>
    body {
      background-color: black;
      color: white;
      margin: 0;
      min-height: 100vh; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 60px 0;
      overflow-x: hidden;
    }

    /* Link Instagram in Helvetica */
    .insta-link {
      color: red;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 40px;
      font-weight: bold;
      text-decoration: none;
      margin-bottom: 30px;
      transition: opacity 0.3s;
    }

    .insta-link:hover {
      opacity: 0.7;
    }

    /* Area Oggetto 3D */
    model-viewer {
      width: 100%;
      height: 450px;
      max-width: 700px;
      outline: none;
      --poster-color: transparent;
    }

    /* Iframe del Flipbook */
    .fp-iframe {
      border: 1px solid #333;
      width: 90%;
      max-width: 1000px;
      height: 600px;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <a href="https://www.instagram.com/lele.matic?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" class="insta-link">
    lele.matic's IG
  </a>

  <model-viewer 
    src="11real_rotante-v3.glb" 
    disable-zoom 
    auto-rotate 
    rotation-speed="300%" 
    orientation="0deg 0deg 0deg" 
    camera-orbit="0deg 90deg auto" 
    interaction-prompt="none" 
    auto-rotate-delay="0" 
    shadow-intensity="0" 
    exposure="1.2" 
    background-color="transparent">
  </model-viewer>

  <iframe 
    class="fp-iframe" 
    src="https://heyzine.com/flip-book/8d4d13745e.html">
  </iframe>

</body>
</html>
